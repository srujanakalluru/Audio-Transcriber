<section class="card">
  <p class="section-label">
    <span class="step-badge">3</span>
    Options
  </p>
  <div class="opts">

    <label class="opt" [class.on]="options().speakers" (click)="toggleOption('speakers')">
      <div class="opt-icon">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <circle cx="6.5" cy="5.5" r="2.8" stroke="currentColor" stroke-width="1.5"/>
          <path d="M1 14C1 11.2 3.5 9 6.5 9C9.5 9 12 11.2 12 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="13.5" cy="6" r="2.1" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
          <path d="M14.5 10.2C15.5 10.9 16.2 12 16.2 13.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </div>
      <div class="opt-text">
        <span class="opt-label">Speaker Labels</span>
        <span class="opt-sub">Detect &amp; label speakers A / B</span>
      </div>
      <div class="ios-toggle" [class.on]="options().speakers"><div class="ios-thumb"></div></div>
    </label>

    @if (options().speakers) {
      <div class="spk-names" (click)="$event.stopPropagation()">
        <div class="spk-name-row">
          <span class="spk-name-tag a">A</span>
          <input
            type="text"
            class="spk-name-input"
            placeholder="Speaker A"
            maxlength="40"
            [value]="speakerAName()"
            (input)="setNameA($any($event.target).value)"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="spk-name-row">
          <span class="spk-name-tag b">B</span>
          <input
            type="text"
            class="spk-name-input"
            placeholder="Speaker B"
            maxlength="40"
            [value]="speakerBName()"
            (input)="setNameB($any($event.target).value)"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
    }

    <div class="opt-rule"></div>

    <label class="opt" [class.on]="options().timestamps" (click)="toggleOption('timestamps')">
      <div class="opt-icon">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <circle cx="8.5" cy="8.5" r="7" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8.5 4.5V9L11.5 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="opt-text">
        <span class="opt-label">Timestamps</span>
        <span class="opt-sub">Wall-clock &amp; elapsed per segment</span>
      </div>
      <div class="ios-toggle" [class.on]="options().timestamps"><div class="ios-thumb"></div></div>
    </label>

    <div class="opt-rule"></div>

    <label class="opt" [class.on]="options().pace" (click)="toggleOption('pace')">
      <div class="opt-icon">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <path d="M2 13C2 13 4 7.5 8.5 7.5C13 7.5 15 13 15 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M8.5 7.5V4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M5.5 8.5L4 6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
          <path d="M11.5 8.5L13 6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
          <circle cx="8.5" cy="13" r="1.4" fill="currentColor"/>
          <path d="M8.5 7.5L11 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="opt-text">
        <span class="opt-label">Pace Indicator</span>
        <span class="opt-sub">Words-per-minute per segment</span>
      </div>
      <div class="ios-toggle" [class.on]="options().pace"><div class="ios-thumb"></div></div>
    </label>

  </div>
</section>

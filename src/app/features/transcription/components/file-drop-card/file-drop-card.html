<section class="card">
  <p class="section-label">
    <span class="step-badge">2</span>
    Audio File
  </p>
  <div
    class="dropzone"
    [class.over]="isDragOver()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <input type="file" class="drop-input" accept="audio/*,video/*" (change)="onFileSelect($event)" />
    <div class="drop-glyph">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M11 15V7M11 7L8 10M11 7L14 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 16.5C3 15.5 2 13.9 2 12C2 9.2 4.2 7 7 7C7.3 7 7.5 7 7.8 7.1C8.7 5.3 10.5 4 12.5 4C15.5 4 18 6.5 18 9.5C18 9.6 18 9.7 18 9.8C19.2 10.4 20 11.6 20 13C20 15 18.2 16.5 16 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="drop-title">Drop file or <span class="drop-cta">click to browse</span></p>
    <p class="drop-formats">m4a · mp3 · wav · mp4 · ogg · flac</p>
  </div>

  @if (selectedFile(); as file) {
    <div class="file-pill">
      <div class="file-pill-icon">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M5 10.5V4L11.5 2.5V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="3.5" cy="10.5" r="1.5" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="10" cy="9" r="1.5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="file-pill-info">
        <span class="file-pill-name">{{ file.name }}</span>
        <span class="file-pill-size">{{ formatBytes(file.size) }}</span>
      </div>
      <button class="file-remove" (click)="remove()">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M1.5 1.5L9.5 9.5M9.5 1.5L1.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  }
</section>

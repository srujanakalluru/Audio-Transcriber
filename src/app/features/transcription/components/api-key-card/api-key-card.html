<section class="card">
  <p class="section-label">
    <span class="step-badge">1</span>
    API Key
  </p>
  <div class="field-row">
    <div class="input-shell">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 15 15" fill="none">
        <circle cx="5.5" cy="6" r="3.3" stroke="currentColor" stroke-width="1.4"/>
        <path d="M7.8 8.4L13.5 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M11 12.2L12.5 10.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input
        [type]="showKey() ? 'text' : 'password'"
        [value]="apiKey()"
        (input)="onInput($any($event.target).value)"
        placeholder="Groq API key"
        class="field-input"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="field-action" (click)="toggleVisibility()">
        @if (!showKey()) {
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M1 7.5C1 7.5 3.5 2.5 7.5 2.5C11.5 2.5 14 7.5 14 7.5C14 7.5 11.5 12.5 7.5 12.5C3.5 12.5 1 7.5 1 7.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="7.5" cy="7.5" r="1.8" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        } @else {
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M2 2L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M6 3.8C6.5 3.6 7 3.5 7.5 3.5C11.5 3.5 14 8 14 8C13.5 8.9 12.8 9.8 12 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M4 5.1C2.7 6.1 1.5 7.7 1.5 7.7C1.5 7.7 4 12.5 7.5 12.5C8.7 12.5 9.8 12.1 10.7 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        }
      </button>
    </div>
  </div>
  <div class="key-status-row">
    @if (hasSaved() && !keyChanged()) {
      <span class="key-status saved">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M1.5 5L4 7.5L8.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Key saved to browser
      </span>
    } @else if (keyChanged() && apiKey().trim()) {
      <span class="key-status unsaved">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5 3V5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <circle cx="5" cy="7" r="0.6" fill="currentColor"/>
        </svg>
        Unsaved — will save on transcribe
      </span>
    } @else {
      <p class="hint-text" style="margin:0">
        Free key at <a href="https://console.groq.com" target="_blank" rel="noopener">console.groq.com ↗</a>
      </p>
    }
    @if (apiKey().trim() && keyChanged()) {
      <button class="inline-save-btn" (click)="save.emit()">Save now</button>
    }
    @if (hasSaved() && !keyChanged()) {
      <button class="inline-clear-btn" (click)="clear.emit()">Clear</button>
    }
  </div>
</section>

<div class="settings-panel card">
  <div class="settings-header">
    <p class="section-label" style="margin-bottom:0">
      <span class="step-badge" style="background:var(--muted)">
        <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
          <circle cx="4.5" cy="3.2" r="1.5" stroke="white" stroke-width="1.2"/>
          <path d="M1 8.5C1 6.8 2.6 5.5 4.5 5.5C6.4 5.5 8 6.8 8 8.5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </span>
      API Configuration
    </p>
    @if (hasSaved()) {
      <span class="saved-badge">
        <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
          <path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Key saved
      </span>
    }
  </div>

  <div class="settings-body">
    <div class="input-shell" style="flex:1">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 15 15" fill="none">
        <circle cx="5.5" cy="6" r="3.3" stroke="currentColor" stroke-width="1.4"/>
        <path d="M7.8 8.4L13.5 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M11 12.2L12.5 10.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input
        [type]="showKey() ? 'text' : 'password'"
        [value]="apiKey()"
        (input)="onInput($any($event.target).value)"
        placeholder="Groq API key"
        class="field-input"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="field-action" (click)="toggleVisibility()">
        @if (!showKey()) {
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M1 7.5C1 7.5 3.5 2.5 7.5 2.5C11.5 2.5 14 7.5 14 7.5C14 7.5 11.5 12.5 7.5 12.5C3.5 12.5 1 7.5 1 7.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="7.5" cy="7.5" r="1.8" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        } @else {
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M2 2L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M6 3.8C6.5 3.6 7 3.5 7.5 3.5C11.5 3.5 14 8 14 8C13.5 8.9 12.8 9.8 12 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M4 5.1C2.7 6.1 1.5 7.7 1.5 7.7C1.5 7.7 4 12.5 7.5 12.5C8.7 12.5 9.8 12.1 10.7 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        }
      </button>
    </div>

    <div class="settings-actions">
      <button
        class="save-btn"
        [disabled]="!apiKey().trim() || !keyChanged()"
        (click)="save.emit()"
      >
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M1.5 6L4.5 9L10.5 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Save key
      </button>
      @if (hasSaved()) {
        <button class="clear-btn" (click)="clear.emit()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Clear
        </button>
      }
    </div>
  </div>

  <p class="hint-text" style="margin-top:10px; margin-bottom:0">
    Your key is stored only in this browser's
    <code style="font-family:var(--font-mono); font-size:11px; background:var(--input-bg); padding:1px 5px; border-radius:4px; border:0.5px solid var(--border-strong)">localStorage</code>
    — never sent anywhere except Groq.
    Get a free key at <a href="https://console.groq.com" target="_blank" rel="noopener">console.groq.com ↗</a>
  </p>
</div>

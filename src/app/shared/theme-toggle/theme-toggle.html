<button
  class="theme-toggle"
  [class.is-dark]="isDark()"
  (click)="toggle()"
  [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
  title="Toggle theme"
>
  <span class="icon sun">☀️</span>
  <span class="track">
    <span class="thumb"></span>
  </span>
  <span class="icon moon">🌙</span>
</button>
